  <title>Solitaire Grand Harvest Playable</title>
  <script>
    var iosLink = "https://apps.apple.com/app/solitaire-grand-harvest/id1223338261";
    var androidLink = "https://play.google.com/store/apps/details?id=net.supertreat.solitaire";
    var userAgent = navigator.userAgent || navigator.vendor;
    var clickTag = /android/i.test(userAgent) ? androidLink : iosLink;
    var link = iosLink;
    var link2 = androidLink;

    function gameStart() {
      if (!window.app || !app.gameStart) { setTimeout(gameStart, 250); return; }
      app.gameStart();
    }
    function gameClose() {
      if (!window.app) return;
      app.gameClose();

    function mobvistaGameReady() { window.gameReady && window.gameReady(); }

  <style>
    * { padding: 0; margin: 0; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
    html, body { position: absolute; inset: 0; overflow: hidden; background: #234d1c; touch-action: none; font-family: "Arial Rounded MT Bold", "Arial Black", Arial, sans-serif; }
    canvas { position: fixed; top: 0; left: 0; }
    #gameContainer { position: absolute; inset: 0; }
    #preloader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #5f9a3a 0%, #234d1c 70%); z-index: 5; transition: opacity .4s; }
    #preloader img { width: 46vw; max-width: 260px; }
    #preloader .bar { width: 50vw; max-width: 280px; height: 10px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; }
    #preloader .bar i { display: block; height: 100%; width: 30%; background: #ffcf3f; border-radius: 6px; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { 0% { transform: translateX(-100%);} 100% { transform: translateX(340%);} }
    .hide { visibility: hidden; opacity: 0; transition: opacity .5s, visibility .5s; }
    .show { visibility: visible; opacity: 1; transition: opacity .5s, visibility .5s; }
    #endcard { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      background: rgba(10, 30, 8, .84); cursor: pointer; }
    #endcard .inner { width: min(88vw, 420px); padding: 26px 22px 28px; border-radius: 28px; text-align: center;
      background: linear-gradient(180deg, #fff2c2 0%, #f6c85a 100%); border: 6px solid #8a5a1e; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
    #endcard .title { color: #3f6b16; font-size: clamp(20px, 6vw, 28px); line-height: 1.05; text-shadow: 0 2px 0 #fff8dd; letter-spacing: .5px; }
    #endcard .title span { display: block; color: #d9531e; font-size: clamp(26px, 8vw, 38px); }
    #endcard .art { width: 42%; margin: 8px auto 2px; display: block; animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
    #endcard h1 { color: #4a2a0c; font-size: clamp(22px, 6.6vw, 32px); line-height: 1.1; margin: 8px 0 6px; }
    #endcard p { color: #6b4212; font-size: clamp(15px, 4.3vw, 19px); font-family: Arial, sans-serif; font-weight: bold; margin-bottom: 18px; }
    #endcard .cta { display: block; width: 100%; padding: 18px 0; border: 0; border-radius: 50px; cursor: pointer;
      background: linear-gradient(180deg, #8ee35a 0%, #3ea52a 100%); color: #fff; font-family: inherit; font-size: clamp(22px, 6.5vw, 30px);
      letter-spacing: 1px; text-shadow: 0 3px 0 rgba(0,0,0,.35); box-shadow: 0 6px 0 #236a14, 0 12px 24px rgba(0,0,0,.35);
      animation: pulse .9s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }
  </style>

        makeAudio();
        s.coins = 0; s.streak = 0; s.taps = 0; s.state = 'deal'; s.ended = false; s.lastInput = s.time.now; s.startTime = s.time.now;
        s.add.image(360, 640, 'table').setDisplaySize(W, H);
        s.drawDecor(); s.drawHUD(); s.buildBoard();
        s.hint = s.add.image(0, 0, 'arrow').setScale(0.8).setDepth(300).setVisible(false); s.hintTween = null;
        s.input.on('pointerdown', function () { s.lastInput = s.time.now; s.hideHint(); });
        window.app = { gameStart: function () { s.scene.resume(); }, gameClose: function () { muted = true; s.scene.pause(); }, game: s.game };
        var pre = document.getElementById('preloader');
        pre.style.opacity = 0; setTimeout(function () { pre.style.display = 'none'; }, 450);
        window.gameReady && window.gameReady();
        s.time.delayedCall(250, function () { s.dealCards(); });
      },

      update: function () {
        var s = this; if (s.ended) return;
        if (s.state === 'play') {
          if (!s.hint.visible && s.time.now - s.lastInput > 2600) s.showHint();
          if (s.time.now - s.lastInput > IDLE_END_MS) s.endGame(s.boardLeft() === 0);
        }
      },

      // ---------- decor + HUD ----------
      drawDecor: function () {
        var s = this;
        s.sam = s.add.image(612, 1075, 'sam').setScale(0.62).setOrigin(0.5, 1);
        s.tweens.add({ targets: s.sam, y: 1068, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        s.add.image(90, 1120, 'carrot').setScale(0.9).setAngle(-8);
        s.add.image(660, 1200, 'carrot').setScale(0.7).setAngle(12);
        s.add.image(360, 1215, 'basket').setScale(0.7).setAlpha(0.95);
      },
      pill: function (x, y, w, h) {
        var g = this.add.graphics();
        g.fillStyle(0x1e3a12, 0.78); g.fillRoundedRect(x, y, w, h, h / 2);
        g.lineStyle(3, 0xffe28a, 0.35); g.strokeRoundedRect(x, y, w, h, h / 2);
        return g;
      },
      drawHUD: function () {
        var s = this, st = { fontFamily: FONT, fontSize: '30px', color: '#fff6d2', stroke: '#1e3a12', strokeThickness: 5 };
        s.pill(26, 30, 290, 72); s.add.image(COIN_TARGET.x, COIN_TARGET.y, 'coin').setScale(0.5);
        s.coinText = s.add.text(100, 66, '0', st).setOrigin(0, 0.5);
        // streak meter
        s.add.image(520, 66, 'streak_bar').setScale(0.95);
        s.add.text(430, 66, 'STREAK', { fontFamily: FONT, fontSize: '20px', color: '#fff2c4', stroke: '#5a3410', strokeThickness: 4 }).setOrigin(0.5).setAngle(-90).setScale(0.9).setX(372);
        s.cells = [];
        for (var i = 0; i < 6; i++) {
          var c = s.add.image(414 + i * 34, 66, 'streak_cell').setScale(0.75).setTint(0x6b4a26);
          s.cells.push(c);
        }
        s.multLabel = s.add.image(650, 66, 'streak_x2').setScale(0.85).setVisible(false);
        s.multText = s.add.text(650, 66, '', { fontFamily: FONT, fontSize: '26px', color: '#ffe24a', stroke: '#5a3410', strokeThickness: 5 }).setOrigin(0.5);
        s.add.text(360, 130, 'Tap a card one higher or lower than the pile', { fontFamily: FONT, fontSize: '24px', color: '#ffffff', stroke: '#1e3a12', strokeThickness: 5 }).setOrigin(0.5).setAlpha(0.95);
      },
      setCoins: function (target, dur) {
        var s = this, from = s.coins; s.coins = target;
        s.tweens.addCounter({ from: from, to: target, duration: dur || 600, ease: 'Cubic.easeOut', onUpdate: function (t) { s.coinText.setText(fmt(t.getValue())); } });
      },
      multiplier: function () { return Math.min(3, 1 + Math.floor(this.streak / 3)); },
      updateStreak: function () {
        var s = this, m = s.multiplier();
        s.cells.forEach(function (c, i) {
          var on = i < Math.min(s.streak, 6);
          c.setTint(on ? 0xffffff : 0x6b4a26);
          if (on && i === s.streak - 1) s.tweens.add({ targets: c, scale: 1.05, duration: 140, yoyo: true });
        });
        if (m > 1) { s.multLabel.setTexture(m === 2 ? 'streak_x2' : 'streak_x3').setVisible(true); s.multText.setText(''); }
        else { s.multLabel.setVisible(false); }
      },
      coinBurst: function (x, y, n, done) {
        var s = this, left = n;
        for (var i = 0; i < n; i++) (function (i) {
          var c = s.add.image(x, y, 'coin_small').setScale(0.9).setDepth(250);
          var ang = Math.random() * Math.PI * 2, r = 40 + Math.random() * 70;
          s.tweens.add({ targets: c, x: x + Math.cos(ang) * r, y: y + Math.sin(ang) * r * 0.7, duration: 260, ease: 'Quad.easeOut', onComplete: function () {
            s.tweens.add({ targets: c, x: COIN_TARGET.x, y: COIN_TARGET.y, scale: 0.5, duration: 480 + i * 30, delay: 80 + i * 25, ease: 'Cubic.easeIn', onComplete: function () { c.destroy(); if (--left === 0 && done) done(); } });
          } });
        })(i);
      },
      floatText: function (x, y, str, color, size) {
        var t = this.add.text(x, y, str, { fontFamily: FONT, fontSize: (size || 40) + 'px', color: color || '#ffe14a', stroke: '#3a2208', strokeThickness: 7 }).setOrigin(0.5).setDepth(260).setScale(0.4);
        this.tweens.add({ targets: t, scale: 1, duration: 220, ease: 'Back.easeOut' });
        this.tweens.add({ targets: t, y: y - 80, alpha: 0, duration: 800, delay: 600, ease: 'Quad.easeIn', onComplete: function () { t.destroy(); } });
      },

      // ---------- board ----------
      key: function (c) { return 'card_' + RANKS[c.v] + SUITS[c.s]; },
      buildBoard: function () {
        var s = this, picked = pickDeal();
        s.slots = picked.slots; s.deal = picked.deal;
        s.cards = s.slots.map(function (sl, i) {
          var img = s.add.image(STOCK.x, STOCK.y, 'card_back').setScale(CARD_SCALE * BIG).setDepth(10 + sl.row * 3).setVisible(false).setInteractive({ useHandCursor: true });
          var c = { v: s.deal.board[i].v, s: s.deal.board[i].s, row: sl.row, x: sl.x, y: sl.y, img: img, removed: false, faceUp: false, i: i };
          img.on('pointerdown', function () { s.onCard(c); });
          return c;
        });
        // stock pile visuals
        s.stockCards = s.deal.stock.slice(); s.stockImgs = [];
        for (var i = 0; i < s.stockCards.length; i++) s.stockImgs.push(s.add.image(STOCK.x - i * 1.6, STOCK.y - i * 1.2, 'card_back').setScale(CARD_SCALE * BIG).setDepth(5 + i).setVisible(false));
        s.stockZone = s.add.zone(STOCK.x, STOCK.y, 150, 200).setInteractive({ useHandCursor: true }).setDepth(40);
        s.stockZone.on('pointerdown', function () { s.onStock(); });
        s.stockCount = s.add.text(STOCK.x, STOCK.y + 105, '', { fontFamily: FONT, fontSize: '24px', color: '#fff6d2', stroke: '#1e3a12', strokeThickness: 5 }).setOrigin(0.5).setDepth(41);
        // waste
        s.wasteSlot = s.add.graphics(); s.wasteSlot.lineStyle(4, 0xffffff, 0.25); s.wasteSlot.strokeRoundedRect(WASTE.x - 47, WASTE.y - 74, 94, 148, 12);
        s.wasteImgs = []; s.top = null;
        s.add.text(WASTE.x + 120, WASTE.y - 20, 'PILE', { fontFamily: FONT, fontSize: '22px', color: '#fff6d2', stroke: '#1e3a12', strokeThickness: 5 }).setOrigin(0.5).setAlpha(0.7);
        s.add.text(STOCK.x, STOCK.y - 105, 'DRAW', { fontFamily: FONT, fontSize: '22px', color: '#fff6d2', stroke: '#1e3a12', strokeThickness: 5 }).setOrigin(0.5).setAlpha(0.7);
      },
      covered: function (c) {
        if (c.row === 2) return false;
        for (var j = 0; j < this.cards.length; j++) { var d = this.cards[j]; if (!d.removed && d.row === c.row + 1 && Math.abs(d.x - c.x) < CW - 2) return true; }
        return false;
      },
      boardLeft: function () { return this.cards.filter(function (c) { return !c.removed; }).length; },
      playable: function () {
        var s = this, out = [];
        for (var i = s.cards.length - 1; i >= 0; i--) { var c = s.cards[i]; if (!c.removed && c.faceUp && !s.covered(c) && s.top && adjacent(c.v, s.top.v)) out.push(c); }
        return out;
      },
      dealCards: function () {
        var s = this, delay = 0;
        s.stockImgs.forEach(function (im) { im.setVisible(true); });
        s.stockCount.setText(String(s.stockCards.length));
        s.cards.forEach(function (c, i) {
          c.img.setVisible(true).setDepth(10 + c.row * 3);
          s.tweens.add({ targets: c.img, x: c.x, y: c.y, scale: CARD_SCALE, duration: 260, delay: delay, ease: 'Quad.easeOut' });
          if (i % 3 === 0) s.time.delayedCall(delay, function () { sfx('deal', 0.5); });
          delay += 45;
        });
        s.time.delayedCall(delay + 200, function () {
          s.cards.forEach(function (c, i) { if (c.row === 2) s.time.delayedCall(i * 18, function () { s.flip(c); }); });
          s.time.delayedCall(700, function () { s.drawFromStock(true); });
        });
      },
      flip: function (c) {
        var s = this; c.faceUp = true;
        s.tweens.add({ targets: c.img, scaleX: 0.02, duration: 110, ease: 'Quad.easeIn', onComplete: function () {
          c.img.setTexture(s.key(c)); s.tweens.add({ targets: c.img, scaleX: CARD_SCALE, duration: 130, ease: 'Quad.easeOut' });
        } });
      },
      revealUncovered: function () {
        var s = this, n = 0;
        s.cards.forEach(function (c) { if (!c.removed && !c.faceUp && !s.covered(c)) { n++; s.time.delayedCall(60, function () { s.flip(c); }); } });
        if (n) sfx('reveal', 0.6);
        return n;
      },
      drawFromStock: function (initial) {
        var s = this; if (!s.stockCards.length) return false;
        var card = s.stockCards.shift(), im = s.stockImgs.pop();
        s.stockCount.setText(String(s.stockCards.length));
        s.top = card; s.streak = 0; if (!initial) s.updateStreak();
        im.setDepth(60 + s.wasteImgs.length);
        s.tweens.add({ targets: im, x: WASTE.x, y: WASTE.y, duration: 220, ease: 'Quad.easeOut' });
        s.tweens.add({ targets: im, scaleX: 0.02, duration: 110, delay: 60, onComplete: function () { im.setTexture(s.key(card)); s.tweens.add({ targets: im, scaleX: CARD_SCALE * BIG, duration: 120 }); } });
        sfx('flip', 0.8);
        s.wasteImgs.push(im);
        if (initial) s.time.delayedCall(500, function () { s.state = 'play'; s.lastInput = s.time.now; s.time.delayedCall(700, function () { if (s.state === 'play') s.showHint(); }); });
        else s.afterMove();
        return true;
      },
      onCard: function (c) {
        var s = this; if (s.state !== 'play' || c.removed) return;
        s.taps++;
        if (!c.faceUp || s.covered(c)) { s.shake(c.img); sfx('miss', 0.6); return; }
        if (!adjacent(c.v, s.top.v)) { s.shake(c.img); sfx('miss', 0.6); return; }
        s.playCard(c);
      },
      shake: function (img) {
        var s = this, x0 = img.x;
        s.tweens.add({ targets: img, x: x0 - 8, duration: 45, yoyo: true, repeat: 3, onComplete: function () { img.x = x0; } });
      },
      playCard: function (c) {
        var s = this; c.removed = true; s.top = c; s.streak++;
        sfx('tap' + (1 + (tapIdx++ % 4)), 0.9);
        var im = c.img; im.disableInteractive(); im.setDepth(60 + s.wasteImgs.length);
        var mult = s.multiplier(), gain = 100 * mult;
        s.tweens.add({ targets: im, x: WASTE.x, y: WASTE.y, scale: CARD_SCALE * BIG, angle: (Math.random() - 0.5) * 8, duration: 260, ease: 'Cubic.easeOut', onComplete: function () { im.setAngle(0); } });
        s.wasteImgs.push(im);
        s.updateStreak();
        if (s.streak > 0 && s.streak % 3 === 0) { sfx('streak', 0.8); s.floatText(360, 230, 'x' + mult + ' STREAK!', '#ffe24a', 44); }
        s.floatText(c.x, c.y - 40, '+' + gain, '#fff8c8', 34);
        s.coinBurst(c.x, c.y, 4 + mult * 2, function () { sfx('balance', 0.5); });
        s.setCoins(s.coins + gain, 600);
        s.time.delayedCall(180, function () { s.revealUncovered(); s.afterMove(); });
      },
      onStock: function () {
        var s = this; if (s.state !== 'play') return;
        s.taps++;
        if (s.playable().length) { // the real game locks the draw pile while a board move exists
          sfx('miss', 0.5); s.stockImgs.forEach(function (im) { s.shake(im); }); s.showHint(); return;
        }
        if (!s.stockCards.length) { s.endGame(false); return; }
        sfx('click', 0.7);
        s.drawFromStock(false);
      },
      afterMove: function () {
        var s = this;
        if (s.boardLeft() === 0) { s.time.delayedCall(350, function () { s.endGame(true); }); return; }
        if (!s.stockCards.length && !s.playable().length) { s.time.delayedCall(500, function () { s.endGame(false); }); return; }
        if (s.taps >= MAX_TAPS) { s.time.delayedCall(500, function () { s.endGame(false); }); return; }
      },

      // ---------- hint ----------
      showHint: function () {
        var s = this; if (s.state !== 'play' || s.ended) return;
        var p = s.playable(), t = p.length ? { x: p[0].x, y: p[0].y + 92 } : (s.stockCards.length ? { x: STOCK.x, y: STOCK.y + 130 } : null);
        if (!t) return;
        s.hint.setPosition(t.x, t.y).setVisible(true).setAlpha(1);
        if (s.hintTween) s.hintTween.stop();
        s.hintTween = s.tweens.add({ targets: s.hint, y: t.y - 16, duration: 380, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        if (p.length) s.tweens.add({ targets: p[0].img, scale: CARD_SCALE * 1.08, duration: 200, yoyo: true, repeat: 1 });
      },
      hideHint: function () { if (this.hintTween) this.hintTween.stop(); this.hint.setVisible(false); },

      // ---------- end ----------
      endGame: function (won) {
        var s = this; if (s.ended) return;
        s.ended = true; s.state = 'end'; s.hideHint();
        if (won) {
          sfx('win', 1); sfx('coins', 0.9);
          s.floatText(360, 470, 'PEAKS CLEARED!', '#ffe24a', 56);
          for (var i = 0; i < 3; i++) (function (i) { var st = s.add.image(260 + i * 100, 560, 'star').setScale(0.2).setDepth(260); s.tweens.add({ targets: st, scale: 1.4, duration: 300, delay: 150 + i * 160, ease: 'Back.easeOut' }); s.time.delayedCall(150 + i * 160, function () { sfx('star', 0.7); }); })(i);
          s.coinBurst(WASTE.x, WASTE.y, 18, null);
          s.setCoins(s.coins + 1000, 900);
        } else {
          sfx('lastcard', 0.9);
          s.floatText(360, 470, 'OUT OF MOVES!', '#ffd0a0', 52);
          document.getElementById('endTitle').textContent = 'So close!';
          document.getElementById('endSub').textContent = 'Use Wild cards and boosters to clear every board in the full game.';
          document.getElementById('endArt').src = IMAGES.wild.src;
        }
        s.time.delayedCall(won ? 1700 : 1100, function () {
          document.getElementById('endcard').className = 'show';
          window.gameEnd && window.gameEnd();
        });
      }
    });

    var IMAGES = {}, game = null;
    function boot() {
      game = new Phaser.Game({
        type: Phaser.AUTO, parent: 'gameContainer', backgroundColor: '#234d1c',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: W, height: H },
        scene: [Main], render: { antialias: true, pixelArt: false }
      });
    }
    (function decodeAll() {
      var keys = Object.keys(ASSETS), left = keys.length;
      keys.forEach(function (k) { var im = new Image(); im.onload = im.onerror = function () { IMAGES[k] = im; if (--left === 0) boot(); }; im.src = ASSETS[k]; });
    })();

    function goStore(e) { if (e) { e.preventDefault(); e.stopPropagation(); } window.open(clickTag, '_blank'); }
    var ec = document.getElementById('endcard');
    ec.addEventListener('click', goStore); ec.addEventListener('touchend', goStore);
    document.getElementById('ctaBtn').addEventListener('click', goStore);
    window.addEventListener('resize', function () { if (game) game.scale.refresh(); });
    // TODO: hook analytics here
  })();
  </script>
</body>
</html>
